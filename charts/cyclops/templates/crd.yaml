{{- if .Values.crd.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crd.keep }}
    helm.sh/resource-policy: keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.22.0
  name: certreports.cyclops.sakshitposting-irl.github.io
spec:
  group: cyclops.sakshitposting-irl.github.io
  names:
    kind: CertReport
    listKind: CertReportList
    plural: certreports
    singular: certreport
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.schedule
      name: Schedule
      type: string
    - jsonPath: .spec.suspend
      name: Suspended
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: CertReport is the Schema for the certreports API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of CertReport
            properties:
              backoffLimit:
                default: 0
                description: |-
                  backoffLimit is how many times a failed report Job is retried. Keep it low:
                  a retried email Job can send the same email twice (ADR 0015).
                format: int32
                minimum: 0
                type: integer
              emailTemplateConfigMapRef:
                description: |-
                  emailTemplateConfigMapRef points at a ConfigMap holding a custom email
                  template. Omitted means the built-in template.
                properties:
                  key:
                    description: key within the ConfigMap that holds the template.
                    minLength: 1
                    type: string
                  name:
                    description: name of the ConfigMap.
                    minLength: 1
                    type: string
                required:
                - key
                - name
                type: object
              failedJobsHistoryLimit:
                default: 1
                description: failedJobsHistoryLimit is how many finished failed Jobs
                  to keep.
                format: int32
                minimum: 0
                type: integer
              namespaces:
                description: |-
                  namespaces limits the report to Certificates in these namespaces. Omitted
                  or empty means all namespaces.
                items:
                  maxLength: 63
                  pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                  type: string
                maxItems: 50
                type: array
                x-kubernetes-list-type: set
              notifiers:
                description: notifiers lists where the report is delivered.
                items:
                  description: Notifier is one delivery channel. Exactly the block
                    named by type is set.
                  properties:
                    email:
                      description: email configures an Email notifier.
                      properties:
                        from:
                          description: from is the sender address.
                          minLength: 1
                          type: string
                        to:
                          description: to lists the recipient addresses.
                          items:
                            type: string
                          type: array
                      required:
                      - from
                      - to
                      type: object
                    type:
                      description: type selects the channel.
                      enum:
                      - Email
                      type: string
                  required:
                  - type
                  type: object
                  x-kubernetes-validations:
                  - message: the block named by type must be set, and no other
                    rule: 'self.type == ''Email'' ? has(self.email) : !has(self.email)'
                minItems: 1
                type: array
                x-kubernetes-list-type: atomic
              schedule:
                default: 0 8 * * *
                description: |-
                  schedule is a cron expression (UTC) for when the report runs. It is copied
                  to the owned CronJob. The CRD only does a loose shape check; the API server
                  has the final word, and a rejected schedule is reported through the
                  ScheduleValid condition.
                minLength: 1
                pattern: ^(@(yearly|annually|monthly|weekly|daily|midnight|hourly)|\S+(\s+\S+){4})$
                type: string
              startingDeadlineSeconds:
                default: 3600
                description: |-
                  startingDeadlineSeconds is how late (in seconds) a run may start after its
                  scheduled time before it is skipped.
                format: int64
                minimum: 1
                type: integer
              successfulJobsHistoryLimit:
                default: 3
                description: successfulJobsHistoryLimit is how many finished successful
                  Jobs to keep.
                format: int32
                minimum: 0
                type: integer
              suspend:
                default: false
                description: |-
                  suspend pauses the report: the owned CronJob is created with suspend set
                  and no further runs fire until it is cleared.
                type: boolean
            required:
            - notifiers
            type: object
          status:
            description: status defines the observed state of CertReport
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the CertReport resource.
                  Each condition has a unique type and reflects the status of a specific aspect of the resource.

                  Standard condition types include:
                  - "Available": the resource is fully functional
                  - "Progressing": the resource is being created or updated
                  - "Degraded": the resource failed to reach or maintain its desired state

                  The status of each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
