apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cyclops.controllerServiceAccount" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cyclops.labels" . | nindent 4 }}
  {{- with .Values.controller.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cyclops.reportServiceAccount" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cyclops.labels" . | nindent 4 }}
  {{- with .Values.reportServiceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
