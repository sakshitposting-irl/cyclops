name: Bug report
description: Something cyclops did, or didn't do, that it should have.
labels: ["bug"]
body:
  - type: textarea
    id: expected
    attributes:
      label: What you did and what you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Include `kubectl describe certreport <name>` and the report Job's logs. Please don't paste credentials or Secret contents.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: cyclops chart, Kubernetes, cert-manager.
    validations:
      required: true
