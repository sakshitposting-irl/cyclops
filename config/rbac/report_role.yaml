# Read-only access for the report Pod (ADR 0010). Hand-written, not generated:
# the +kubebuilder:rbac markers only produce the manager's role.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: cyclops
    app.kubernetes.io/managed-by: kustomize
  name: report-role
rules:
- apiGroups: ["cert-manager.io"]
  resources: ["certificates", "certificaterequests"]
  verbs: ["get", "list"]
- apiGroups: ["acme.cert-manager.io"]
  resources: ["orders", "challenges"]
  verbs: ["get", "list"]
- apiGroups: ["cyclops.sakshitposting-irl.github.io"]
  resources: ["certreports"]
  verbs: ["get"]
---
# Custom email template lookup (ADR 0005), limited to the cyclops namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/name: cyclops
    app.kubernetes.io/managed-by: kustomize
  name: report-template-role
  namespace: system
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get"]
