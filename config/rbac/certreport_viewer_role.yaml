# This rule is not used by the project cyclops itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to cyclops.sakshitposting-irl.github.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: cyclops
    app.kubernetes.io/managed-by: kustomize
  name: certreport-viewer-role
rules:
- apiGroups:
  - cyclops.sakshitposting-irl.github.io
  resources:
  - certreports
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - cyclops.sakshitposting-irl.github.io
  resources:
  - certreports/status
  verbs:
  - get
