# This rule is not used by the project cyclops itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the cyclops.sakshitposting-irl.github.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: cyclops
    app.kubernetes.io/managed-by: kustomize
  name: certreport-editor-role
rules:
- apiGroups:
  - cyclops.sakshitposting-irl.github.io
  resources:
  - certreports
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - cyclops.sakshitposting-irl.github.io
  resources:
  - certreports/status
  verbs:
  - get
