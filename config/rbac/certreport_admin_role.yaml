# This rule is not used by the project cyclops itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over cyclops.sakshitposting-irl.github.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: cyclops
    app.kubernetes.io/managed-by: kustomize
  name: certreport-admin-role
rules:
- apiGroups:
  - cyclops.sakshitposting-irl.github.io
  resources:
  - certreports
  verbs:
  - '*'
- apiGroups:
  - cyclops.sakshitposting-irl.github.io
  resources:
  - certreports/status
  verbs:
  - get
